name: family-butler

x-app: &app
  build: .
  image: family-butler:local
  restart: unless-stopped
  environment:
    DATABASE_URL: postgres://family_butler:${POSTGRES_PASSWORD:-family_butler}@postgres:5432/family_butler
    # Set to true behind your own HTTPS reverse proxy, so session cookies become Secure.
    TRUST_PROXY: ${TRUST_PROXY:-false}
    MASTER_KEY_FILE: /var/lib/family-butler/master-key/master.key
    BLOB_DIRECTORY: /var/lib/family-butler/blobs
    PLUGIN_DIRECTORY: /var/lib/family-butler/plugins
    # The Family's time zone, which decides where a View's days start.
    TZ: ${TZ:-Europe/Berlin}
  volumes:
    # The master key that Source credentials are encrypted with; never in Postgres (ADR-0006).
    - master-key:/var/lib/family-butler/master-key
    # Files such as Family Member photos, kept outside Postgres (ADR-0006).
    - blobs:/var/lib/family-butler/blobs
    # Source plugins added to the stock image, one package directory each (ADR-0010).
    - plugins:/var/lib/family-butler/plugins
  depends_on:
    postgres:
      condition: service_healthy

services:
  api:
    <<: *app
    ports:
      - "${PORT:-8080}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s

  worker:
    <<: *app
    working_dir: /app/apps/worker

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: family_butler
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-family_butler}
      POSTGRES_DB: family_butler
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "family_butler", "-d", "family_butler"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  master-key:
  blobs:
  plugins:
