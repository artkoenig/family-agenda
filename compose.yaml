name: family-agenda

# The image api, worker and mdns run, written once so that one setting moves all three together.
# FAMILY_AGENDA_VERSION is a release such as 0.3.1, `latest` for the newest release or `main` for
# the current main branch. The default is the release this file belongs to; a release sets it.
# To build the image from this working tree instead, add compose.dev.yaml (see docs/upgrading.md).
x-image: &image ghcr.io/artkoenig/family-agenda:${FAMILY_AGENDA_VERSION:-0.1.0}

x-app: &app
  image: *image
  restart: unless-stopped
  environment:
    DATABASE_URL: postgres://family_agenda:${POSTGRES_PASSWORD:-family_agenda}@postgres:5432/family_agenda
    # The address the Family opens the Instance at, which Agendas show and copy. By default the name
    # the `mdns` service announces; set it to your own, such as behind a reverse proxy with HTTPS.
    PUBLIC_URL: ${PUBLIC_URL:-http://${MDNS_NAME:-family-agenda.local}:${PORT:-8080}}
    # Set to true behind your own HTTPS reverse proxy, so session cookies become Secure.
    TRUST_PROXY: ${TRUST_PROXY:-false}
    # The key Source credentials are encrypted with, 32 bytes in base64: `openssl rand -base64 32`.
    # An Instance started before this setting keeps its key in the master-key volume, read when this is empty.
    MASTER_KEY: ${MASTER_KEY:-}
    MASTER_KEY_FILE: /var/lib/family-agenda/master-key/master.key
    BLOB_DIRECTORY: /var/lib/family-agenda/blobs
    TESSDATA_DIRECTORY: /var/lib/family-agenda/tessdata
    # How the Matrix plugin reaches Synapse and the bridges, which the worker runs.
    MATRIX_INSTANCE_FILE: /var/lib/family-agenda/matrix/instance.json
    # The Family's time zone, which decides where an Agenda's days start.
    TZ: ${TZ:-Europe/Berlin}
    # Every Source plugin runs in the Plugin Host, isolated from the database, the master key and
    # the blobs. api, worker and plugin-host share this token: `openssl rand -hex 32`.
    PLUGIN_HOST_URL: http://plugin-host:4100
    PLUGIN_HOST_TOKEN: ${PLUGIN_HOST_TOKEN:?Set PLUGIN_HOST_TOKEN, such as to the output of openssl rand -hex 32}
  volumes:
    # The master key that Source credentials are encrypted with; never in Postgres.
    - master-key:/var/lib/family-agenda/master-key
    # Files such as Family Member photos, kept outside Postgres.
    - blobs:/var/lib/family-agenda/blobs
    # Tesseract models: the bundled ones linked on start, the ones Admins download, and any put
    # here by hand as <code>.traineddata for an Instance without internet access.
    - tessdata:/var/lib/family-agenda/tessdata
    # Empty until an Admin enables a Messenger; then it holds how to reach Synapse and the bridges.
    - matrix-instance:/var/lib/family-agenda/matrix:ro
  depends_on:
    postgres:
      condition: service_healthy

services:
  api:
    <<: *app
    ports:
      - "${PORT:-8080}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s

  worker:
    <<: *app
    working_dir: /app/apps/worker
    # Reaps the processes of Synapse and the bridges, which the worker starts while a Messenger is
    # enabled. They are reachable only on the Instance's own network, at `worker`.
    init: true
    volumes:
      - master-key:/var/lib/family-agenda/master-key
      - blobs:/var/lib/family-agenda/blobs
      - tessdata:/var/lib/family-agenda/tessdata
      # The worker writes how the api reaches Synapse and the bridges.
      - matrix-instance:/var/lib/family-agenda/matrix
      # Synapse's configuration and media and the bridges' Messenger sessions, in SQLite outside
      # Postgres. Synapse's own database is on the Postgres server, created by the worker.
      - matrix-data:/var/lib/family-agenda/matrix-data

  # Runs Source plugins, each as a Node process of its own user, with an empty environment, its own
  # temp space, the permission model and limits. It holds no database, master key or blobs, and
  # writes only to its tmpfs. It starts as root only to give each plugin its own user.
  plugin-host:
    image: *image
    restart: on-failure
    working_dir: /app/apps/plugin-host
    command: ["node", "--import", "tsx", "src/main.ts"]
    user: "0:0"
    environment:
      PLUGIN_HOST_TOKEN: ${PLUGIN_HOST_TOKEN:?Set PLUGIN_HOST_TOKEN, such as to the output of openssl rand -hex 32}
      # Until there is a Plugin Repository, a mock one publishes these workspace packages.
      MOCK_PLUGIN_REPOSITORY: ${MOCK_PLUGIN_REPOSITORY:-packages/source-ics,packages/source-imap,packages/source-webuntis}
      TZ: ${TZ:-Europe/Berlin}
    read_only: true
    tmpfs:
      # Where each plugin gets its directory and temp space; tsx caches in /tmp.
      - /run/plugin-host:mode=0711
      - /tmp:mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - KILL
    security_opt:
      - no-new-privileges:true

  # Makes the Instance reachable at http://family-agenda.local:8080 from any device on the home
  # network, like homeassistant.local. It has to share the host's network to answer multicast DNS,
  # which works on a Linux host, such as a NAS or a Raspberry Pi, but not in Docker Desktop.
  mdns:
    image: *image
    restart: unless-stopped
    network_mode: host
    working_dir: /app/apps/api
    command: ["node", "--import", "tsx", "src/mdns-main.ts"]
    environment:
      MDNS_NAME: ${MDNS_NAME:-family-agenda.local}
    depends_on:
      - api

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: family_agenda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-family_agenda}
      POSTGRES_DB: family_agenda
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "family_agenda", "-d", "family_agenda"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  master-key:
  blobs:
  tessdata:
  matrix-instance:
  matrix-data:
