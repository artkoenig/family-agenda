# Layered last, over the pull request's own compose.yaml and the compose.plugins.yaml its generator
# makes from tools/preview/plugins.yml, by `pnpm preview up` (tools/preview/src/plan.ts), which sets
# PORT, PUBLIC_URL, PREVIEW_ROOT, PREVIEW_TOOLS, PREVIEW_IMAGE, PREVIEW_DEMO_IMAGE,
# EGRESS_PROXY_IMAGE (the egress proxies run the preview's own core image), PREVIEW_IDP_PORT and
# the OIDC_* variables that point the Instance at the mock Identity Provider `idp`. A preview is a throwaway
# Instance: its own images and volumes (Compose prefixes the volumes with the project), none of the
# real Instance's.
services:
  api:
    # The pull request's own compose.yaml only names a release image, so the build is asked for
    # here: relative to the pull request's worktree, which is the project directory.
    build: .
    image: ${PREVIEW_IMAGE}
    ports:
      # The mock Identity Provider's, which shares this container's network (see `idp`).
      - "${PREVIEW_IDP_PORT}:${PREVIEW_IDP_PORT}"
    volumes:
      # The seed, from the clone `pnpm preview` runs in: a pull request may predate it.
      - ${PREVIEW_TOOLS}:/preview-tools:ro
  worker:
    image: ${PREVIEW_IMAGE}
  # The demo Source's plugin container (ADR-0001), built from the clone `pnpm preview` runs in.
  plugin-demo:
    build:
      context: ${PREVIEW_ROOT}
      dockerfile: tools/demo-source/Dockerfile
    image: ${PREVIEW_DEMO_IMAGE}
  # Announces family-agenda.local on the host's network, which a preview must not take over.
  mdns:
    image: ${PREVIEW_IMAGE}
    profiles: ["never"]
  # The Identity Provider Admins sign in through (ADR-0009): a click-through sign-in page that
  # issues the required group and a verified email (<name>@preview.test) to whoever signs in, with
  # no password or passkey. It shares the
  # network of `api`, so that its issuer, http://localhost:<PREVIEW_IDP_PORT>/preview, is the same
  # address for the browser (through the port `api` publishes) and for `api` itself.
  idp:
    image: ghcr.io/navikt/mock-oauth2-server:7.0.2@sha256:95966a61e512c003daa3c884623665c2bbf04f46f85ce97d7ee659384d804202
    network_mode: service:api
    environment:
      SERVER_PORT: ${PREVIEW_IDP_PORT}
      JSON_CONFIG: >-
        {"interactiveLogin": true, "tokenCallbacks": [{"issuerId": "preview", "requestMappings": [
        {"requestParam": "subject", "match": ".*", "claims": {"sub": "$${subject}",
        "preferred_username": "$${subject}", "name": "$${subject}", "email": "$${subject}@preview.test",
        "email_verified": true, "groups": ["homelab-admin"]}}]}]}
