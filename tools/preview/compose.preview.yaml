# Layered over the pull request's own compose.yaml by `pnpm preview up` (tools/preview/src/plan.ts),
# which sets PORT, PUBLIC_URL, PREVIEW_IMAGE and PREVIEW_TOOLS. A preview is a throwaway Instance:
# its own image and volumes (Compose prefixes them with the project), none of the real Instance's.
services:
  api:
    # The pull request's own compose.yaml only names a release image, so the build is asked for
    # here: relative to the pull request's worktree, which is the project directory.
    build: .
    image: ${PREVIEW_IMAGE}
    volumes:
      # The seed, from the clone `pnpm preview` runs in: a pull request may predate it.
      - ${PREVIEW_TOOLS}:/preview-tools:ro
  worker:
    image: ${PREVIEW_IMAGE}
  plugin-host:
    image: ${PREVIEW_IMAGE}
    volumes:
      - ${PREVIEW_TOOLS}/demo-source:/preview-tools/demo-source:ro
    environment:
      # The demo Source, published like the plugins of the image.
      MOCK_PLUGIN_REPOSITORY: packages/source-ics,packages/source-imap,packages/source-webuntis,/preview-tools/demo-source
  # Announces family-agenda.local on the host's network, which a preview must not take over.
  mdns:
    image: ${PREVIEW_IMAGE}
    profiles: ["never"]
