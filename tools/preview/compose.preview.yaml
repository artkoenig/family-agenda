# Layered last, over the pull request's own compose.yaml and the compose.plugins.yaml its generator
# makes from tools/preview/plugins.yml, by `pnpm preview up` (tools/preview/src/plan.ts), which sets
# PORT, PUBLIC_URL, PREVIEW_ROOT, PREVIEW_TOOLS, PREVIEW_IMAGE, PREVIEW_DEMO_IMAGE and
# EGRESS_PROXY_IMAGE (the egress proxies run the preview's own core image). A preview is a throwaway
# Instance: its own images and volumes (Compose prefixes the volumes with the project), none of the
# real Instance's.
services:
  api:
    # The pull request's own compose.yaml only names a release image, so the build is asked for
    # here: relative to the pull request's worktree, which is the project directory.
    build: .
    image: ${PREVIEW_IMAGE}
    volumes:
      # The seed, from the clone `pnpm preview` runs in: a pull request may predate it.
      - ${PREVIEW_TOOLS}:/preview-tools:ro
  worker:
    image: ${PREVIEW_IMAGE}
  # The demo Source's plugin container (ADR-0001), built from the clone `pnpm preview` runs in.
  plugin-demo:
    build:
      context: ${PREVIEW_ROOT}
      dockerfile: tools/demo-source/Dockerfile
    image: ${PREVIEW_DEMO_IMAGE}
  # Announces family-agenda.local on the host's network, which a preview must not take over.
  mdns:
    image: ${PREVIEW_IMAGE}
    profiles: ["never"]
