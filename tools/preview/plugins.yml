# The plugin containers of a preview. `pnpm preview up` copies this file into the pull request's
# worktree and generates compose.plugins.yaml from it with the pull request's own generator. The
# demo Source is built from this clone (compose.preview.yaml names the image it is built into);
# other plugins added here with pinned images are pulled.
plugins:
  - id: demo
    image: family-agenda-demo-source-preview:local
