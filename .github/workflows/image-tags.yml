name: Image tags

# Puts the platform images that image.yml pushed by digest behind one name: a manifest list with
# the given tags. This is the step that makes an image pullable. Called by publish-main.yml and
# release.yml, in the same run as image.yml, whose digests it takes from the run's artifacts.

on:
  workflow_call:
    inputs:
      tags:
        description: The tags to publish, one per line, such as 0.3.1, 0.3 and latest
        required: true
        type: string

permissions: {}

env:
  IMAGE: ghcr.io/artkoenig/family-agenda

jobs:
  tag:
    name: Publish ${{ inputs.tags }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the manifest list with the tags
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          tag_arguments=()
          while read -r tag; do
            [ -n "$tag" ] && tag_arguments+=(--tag "$IMAGE:$tag")
          done <<< "$TAGS"
          [ "${#tag_arguments[@]}" -gt 0 ] || { echo "::error::No tags were given"; exit 1; }
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          [ "${#sources[@]}" -eq 2 ] || { echo "::error::Expected the digests of 2 platforms, found ${#sources[@]}"; exit 1; }
          docker buildx imagetools create "${tag_arguments[@]}" "${sources[@]}"

      - name: Check the published image
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          first=$(head -n 1 <<< "$TAGS")
          docker buildx imagetools inspect "$IMAGE:$first"
          for attestation in Provenance SBOM; do
            docker buildx imagetools inspect "$IMAGE:$first" --format "{{ json .${attestation} }}" \
              | jq -e 'type == "object" and length > 0' > /dev/null \
              || { echo "::error::The merged image has no $attestation attestation"; exit 1; }
          done
