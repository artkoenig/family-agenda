name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The use cases run against an in-process Postgres; only creating Synapse's database needs a server.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # The PDF tests skip where poppler or Tesseract is missing; here a missing tool fails them.
      REQUIRE_OCR: "true"
    steps:
      - uses: actions/checkout@v5
      - name: Install poppler and Tesseract, which turn PDF attachments into text
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm depcruise
      - run: pnpm test

  mutation:
    # Mutation testing of the pure-logic `domain` package (see stryker.config.json).
    # No database or OCR tools are needed: the domain tests are deterministic and dependency-free.
    # The job fails when the mutation score drops below `thresholds.break` in stryker.config.json.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm mutation
