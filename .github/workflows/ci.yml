name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The use cases run against an in-process Postgres; only creating Synapse's database needs a server.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # The PDF tests skip where poppler or Tesseract is missing; here a missing tool fails them.
      REQUIRE_OCR: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tags, to compare the SDK with the last release.
          fetch-depth: 0
      - name: Install poppler and Tesseract, which turn PDF attachments into text
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Lint, typecheck, dependency rules, tests with the CRAP score, and mutation testing of `domain`.
      - run: pnpm check
      # A change to the SDK's public API since the last release needs a higher SDK version
      # (packages/source-sdk/package.json), so that plugins built for the old one are told apart.
      - name: The SDK version follows its API
        run: node --import tsx tools/release/src/main.ts check-sdk --previous "$(git describe --tags --abbrev=0 --match 'v*' 2> /dev/null || true)"
