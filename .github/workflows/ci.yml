name: CI

on:
  push:
    branches: [main]
  pull_request:

# The three jobs together are `pnpm check`; they run in parallel.
jobs:
  static:
    # Lint, typecheck, dependency rules, and the plugin contract's version against its OpenAPI
    # document: a change to packages/plugin-contract/openapi.json since the last release needs a
    # higher contractVersion (breaking: major, additive: minor), so that plugins built for the old
    # one are told apart.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm depcruise
      - uses: ./.github/actions/oasdiff
      - name: The plugin contract version follows its OpenAPI document
        run: node --import tsx tools/release/src/main.ts check-contract --previous "$(git describe --tags --abbrev=0 --match 'v*' 2> /dev/null || true)"

  crap:
    # All tests with coverage, and the CRAP score.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The use cases run against an in-process Postgres; only creating Synapse's database needs a server.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # The PDF tests skip where poppler or Tesseract is missing; here a missing tool fails them.
      REQUIRE_OCR: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install poppler and Tesseract, which turn PDF attachments into text
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng
      - uses: ./.github/actions/setup
      - run: pnpm crap

  mutation:
    # Mutation testing of `domain`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm mutation
