name: CI

on:
  push:
    branches: [main]
  pull_request:

# The static, crap and mutation jobs together are `pnpm check`; all jobs run in parallel.
jobs:
  static:
    # Lint, typecheck, dependency rules, and the plugin contract's version against its OpenAPI
    # document: a change to packages/plugin-contract/openapi.json since the last release needs a
    # higher contractVersion (breaking: major, additive: minor), so that plugins built for the old
    # one are told apart.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm depcruise
      - uses: ./.github/actions/oasdiff
      - name: The plugin contract version follows its OpenAPI document
        run: node --import tsx tools/release/src/main.ts check-contract --previous "$(git describe --tags --abbrev=0 --match 'v*' 2> /dev/null || true)"

  crap:
    # All tests with coverage, and the CRAP score.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The use cases run against an in-process Postgres; only creating Synapse's database needs a server.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # The PDF tests skip where poppler or Tesseract is missing; here a missing tool fails them.
      REQUIRE_OCR: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install poppler and Tesseract, which turn PDF attachments into text
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng
      - uses: ./.github/actions/setup
      - run: pnpm crap

  containers:
    # The core with the demo Source as a plugin container, wired by the generator from
    # .github/container-ci/plugins.yml (ADR-0001): the core reaches the plugin's /description, and
    # the plugin reaches its declared egress host through its proxy and nothing else.
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: compose.yaml:compose.dev.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f tools/demo-source/Dockerfile -t family-agenda-demo-source:ci .
      - run: docker compose build api
      - name: Generate compose.plugins.yaml
        run: |
          cp .github/container-ci/plugins.yml plugins.yml
          docker compose run --rm --no-deps --user "$(id -u):$(id -g)" -v "$PWD:/deployment" api plugins generate
          cat compose.plugins.yaml
      - name: Start the Instance with its plugin containers
        run: docker compose -f compose.yaml -f compose.dev.yaml -f compose.plugins.yaml up --detach --wait --scale mdns=0
      - name: The core describes the demo Source from its container
        run: |
          check='
            const { bootApplication } = await import("/app/apps/api/src/composition-root.ts");
            const { readConfig } = await import("/app/apps/api/src/config.ts");
            const app = await bootApplication(readConfig());
            try {
              const demo = (await app.sourceTypes.list()).find((type) => type.id === "demo");
              console.log(JSON.stringify(demo));
              if (!demo || demo.notReachable !== null || demo.notLoadable !== null) process.exitCode = 1;
            } finally {
              await app.close();
            }'
          for _ in $(seq 30); do
            docker compose -f compose.yaml -f compose.dev.yaml -f compose.plugins.yaml exec -T api node --import tsx --input-type=module -e "$check" && exit 0
            sleep 2
          done
          exit 1
      - name: The demo Source reaches example.com through its egress proxy, and nothing else
        run: |
          check='
            const http = require("node:http");
            const https = require("node:https");
            const proxy = new URL(process.env.HTTPS_PROXY);
            const connect = (target) => new Promise((resolve, reject) => {
              const request = http.request({ host: proxy.hostname, port: proxy.port, method: "CONNECT", path: target });
              request.on("connect", (response, socket) => { socket.destroy(); resolve(response.statusCode); });
              request.on("error", reject);
              request.setTimeout(15000, () => request.destroy(new Error("timed out")));
              request.end();
            });
            const direct = () => new Promise((resolve) => {
              const request = https.get("https://example.com/", { agent: false, timeout: 10000 }, () => resolve("reached"));
              request.on("timeout", () => request.destroy(new Error("timed out")));
              request.on("error", (error) => resolve(`refused: ${error.message}`));
            });
            (async () => {
              const allowed = await connect("example.com:443");
              const other = await connect("example.org:443");
              const withoutProxy = await direct();
              console.log({ allowed, other, withoutProxy });
              if (allowed !== 200 || other !== 403 || withoutProxy === "reached") process.exit(1);
            })().catch((error) => { console.error(error); process.exit(1); });'
          docker compose -f compose.yaml -f compose.dev.yaml -f compose.plugins.yaml exec -T plugin-demo node -e "$check"
      - name: Logs
        if: failure()
        run: docker compose -f compose.yaml -f compose.dev.yaml -f compose.plugins.yaml logs

  mutation:
    # Mutation testing of `domain`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm mutation
