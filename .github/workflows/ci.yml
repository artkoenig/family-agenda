name: CI

on:
  push:
    branches: [main]
  pull_request:

# The static, crap and mutation jobs together are `pnpm check`; all jobs run in parallel.
jobs:
  static:
    # Lint, typecheck, dependency rules, and the plugin contract's version against its OpenAPI
    # document: a change to packages/plugin-contract/openapi.json since the last release needs a
    # higher contractVersion (breaking: major, additive: minor), so that plugins built for the old
    # one are told apart.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm depcruise
      - uses: ./.github/actions/oasdiff
      - name: The plugin contract version follows its OpenAPI document
        run: node --import tsx tools/release/src/main.ts check-contract --previous "$(git describe --tags --abbrev=0 --match 'v*' 2> /dev/null || true)"

  crap:
    # All tests with coverage, and the CRAP score.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The use cases run against an in-process Postgres; only creating Synapse's database needs a server.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm crap

  containers:
    # The core with the demo Source as a plugin container, wired by the generator from
    # .github/container-ci/plugins.yml (ADR-0001): the core reaches the plugin's /description, and
    # the plugin reaches its declared egress host through its proxy and nothing else. The image
    # also runs the tests of the command-line tools it ships, which `pnpm check` leaves out.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Set through GITHUB_ENV, not `env:`, so that generating compose.plugins.yaml can extend it.
      - run: echo "COMPOSE_FILE=compose.yaml:compose.dev.yaml" >> "$GITHUB_ENV"
      - run: docker build -f tools/demo-source/Dockerfile -t family-agenda-demo-source:ci .
      - run: docker compose build api
      - name: poppler and Tesseract in the image turn PDF attachments into text
        run: .github/container-ci/image-tests.sh family-agenda:local
      - name: Generate compose.plugins.yaml
        # The generated file names the egress tokens as ${...} only; their values stay in .env.
        run: |
          cp .github/container-ci/plugins.yml plugins.yml
          docker compose run --rm --no-deps --user "$(id -u):$(id -g)" -v "$PWD:/deployment" api plugins generate
          cat compose.plugins.yaml
          echo "COMPOSE_FILE=compose.yaml:compose.dev.yaml:compose.plugins.yaml" >> "$GITHUB_ENV"
      - name: Start the Instance with its plugin containers
        run: docker compose up --detach --wait --scale mdns=0
      - name: The core describes the demo Source from its container
        run: .github/container-ci/check-core.sh http://localhost:8080
      - name: The demo Source reaches example.com through its egress proxy, and nothing else
        run: docker compose exec -T plugin-demo node --input-type=module - < .github/container-ci/check-egress.mjs
      - name: Logs
        if: failure()
        run: docker compose logs

  mutation:
    # Mutation testing of `domain`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm mutation
