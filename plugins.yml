# The plugin containers of the Instance (ADR-0001), pinned to the images this release was tested
# with; Renovate raises the tags. Remove the plugins you do not use, add your own, then generate
# compose.plugins.yaml from it (docs/configuration.md#plugins). plugins.schema.json is its schema.
plugins:
  # Calendars by ICS address. The address is a secret host field from plugin contract 1.2 on, whose
  # host the egress proxy allows by itself; for an older plugin, add the host of each calendar
  # here, such as calendar.google.com:443.
  - id: ics
    image: ghcr.io/artkoenig/family-agenda-ics:0.4.0@sha256:830488f1f64b65372c49d3a65cfc7e386e45c310eed64a4dbbbfb5f3d35a724a
    egress: []

  # Mailboxes over IMAP. The mail server is a host field, which the egress proxy allows by itself.
  - id: imap
    image: ghcr.io/artkoenig/family-agenda-imap:0.3.0@sha256:676319139e6130c88a21cc870483c747fe2387e75e3bd7a9e0ab4d2f86e3c1c5

  # Timetables from WebUntis. The server is a host field, which the egress proxy allows by itself.
  - id: webuntis
    image: ghcr.io/artkoenig/family-agenda-webuntis:0.3.0@sha256:1395ed919e299ed1f3851e1746ee7991f1b7e0797208b038c93024c1f3b55ab5

  # Opt-in: messengers through Matrix bridges (ADR-0002), as in plugins.example.yml of the plugin's repository.
  # Uncomment the block to use it.
  # The plugin keeps the secrets in its own `matrix-secrets` volume, which no companion mounts, and
  # writes each companion's configuration into a volume shared with that companion alone, creating
  # `ready` in it last; the companion waits for it, then starts from it. A companion without `ready`
  # after five minutes exits and is restarted. (`$$` is a `$` to Docker Compose.)
